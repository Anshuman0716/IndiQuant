[project]
name = "indiquant"
version = "0.1.0"
description = "Systematic research and backtesting platform for Indian equities"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
ingest = [
    "httpx>=0.27.0",
    "polars>=1.0.0",
]
research = [
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "vectorbt>=0.25.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "mypy>=1.11.0",
    "nbstripout>=0.8.0",
    "pre-commit>=3.8.0",
    "pytest-cov>=5.0.0",
    "pytest>=8.3.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["indiquant"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
